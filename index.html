<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>린다이어트 양약 병용 가능 여부 판독기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start text-slate-800 antialiased pt-12 sm:pt-20 px-4 pb-16">

  <!-- 메인 컨테이너 -->
  <div class="w-full max-w-2xl mx-auto space-y-6">

    <!-- 미니멀 헤더 -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center px-3.5 py-1 rounded-full bg-[#f3f0fc] text-[#6340cd] border border-[#e2d9f9] text-xs font-bold shadow-sm">
        린다이어트 한의원을 위한
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">양약 병용 가능 여부 판독기</h1>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">약 이름이나 성분명을 검색하면 다이어트 한약(마황제) 병용 가능 여부를 즉시 알려드립니다.</p>
    </div>

    <!-- 대형 깔끔한 검색창 (구글 스타일) -->
    <div class="relative shadow-md rounded-2xl bg-white border border-slate-200 focus-within:border-[#6340cd] focus-within:ring-4 focus-within:ring-[#6340cd]/15 transition-all">
      <div class="flex items-center px-4 py-3.5">
        <i data-lucide="search" class="w-5 h-5 text-slate-400 mr-3 shrink-0"></i>
        <input
          id="search-input"
          type="text"
          autofocus
          autocomplete="off"
          placeholder="약 이름이나 성분명을 입력하세요."
          class="w-full text-base sm:text-lg text-slate-900 placeholder-slate-400 focus:outline-none bg-transparent font-medium"
          oninput="handleSearch(this.value)"
        />
        <button id="clear-btn" onclick="clearInput()" class="hidden text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- 검색 결과 영역 -->
    <div id="result-area" class="space-y-4">
      <!-- 초기 안내 / 검색 결과가 직관적으로 렌더링됩니다 -->
    </div>

    <!-- 하단 전체 금기/주의 성분 목록 보기 버튼 -->
    <div class="text-center pt-8">
      <button onclick="toggleAllIngredientsModal()" class="text-xs text-slate-400 hover:text-slate-700 underline font-medium transition">
        전체 금기(67종) 및 주의(100여종) 성분 및 연구진 의견 목록 보기
      </button>
    </div>

  </div>

  <!-- 전체 성분 확인 팝업 모달 -->
  <div id="all-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <h3 class="font-bold text-base text-slate-900">연구진 검토 금기 및 주의 성분 전체 목록</h3>
        <button onclick="toggleAllIngredientsModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="overflow-y-auto flex-1 mt-3 space-y-2 pr-1 text-xs">
        <div id="modal-list" class="divide-y divide-slate-100"></div>
      </div>
    </div>
  </div>

  <!-- 복사 완료 토스트 -->
  <div id="toast" class="fixed bottom-6 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg z-50 text-xs font-semibold translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    복사되었습니다.
  </div>

  <script src="drugData.js?v=20260908_1700"></script>
  <script src="app.js?v=20260908_1700"></script>
</body>
</html>
